# Local preview site for the theme in the parent directory (not used by micro.blog).
baseURL = "/"
title = "Jarrett Preview"
languageCode = "en-us"
paginate = 20
disableKinds = ["RSS", "sitemap", "robotsTXT"]

[taxonomies]
  category = "categories"

# micro.blog renders /archive/ from the home page; the other archive formats mirror ../config.json.
[outputFormats.ArchiveHTML]
  mediaType = "text/html"
  path = "archive"
  baseName = "index"
  isHTML = true
  notAlternative = true

[outputFormats.ArchiveClassic]
  mediaType = "text/html"
  path = "archive/classic"
  baseName = "index"
  isHTML = true
  notAlternative = true

[outputFormats.ArchiveLedger]
  mediaType = "text/html"
  path = "archive/ledger"
  baseName = "index"
  isHTML = true
  notAlternative = true

[outputFormats.ArchiveRhythm]
  mediaType = "text/html"
  path = "archive/rhythm"
  baseName = "index"
  isHTML = true
  notAlternative = true

[outputFormats.ArchiveLanes]
  mediaType = "text/html"
  path = "archive/lanes"
  baseName = "index"
  isHTML = true
  notAlternative = true

[outputFormats.ArchiveAlmanac]
  mediaType = "text/html"
  path = "archive/almanac"
  baseName = "index"
  isHTML = true
  notAlternative = true

[outputFormats.ArchiveIndex]
  mediaType = "text/html"
  path = "archive/index"
  baseName = "index"
  isHTML = true
  notAlternative = true

[outputFormats.ArchiveQuilt]
  mediaType = "text/html"
  path = "archive/quilt"
  baseName = "index"
  isHTML = true
  notAlternative = true

[outputFormats.ArchiveReceipt]
  mediaType = "text/html"
  path = "archive/receipt"
  baseName = "index"
  isHTML = true
  notAlternative = true

[outputs]
  home = ["HTML", "ArchiveHTML", "ArchiveClassic", "ArchiveLedger", "ArchiveRhythm", "ArchiveLanes", "ArchiveAlmanac", "ArchiveIndex", "ArchiveQuilt", "ArchiveReceipt"]

[markup.goldmark.renderer]
  unsafe = true

[params]
  theme_seconds = "preview"
  archive_style = "classic"
  itunes_description = "Preview of the Jarrett micro.blog theme."

[author]
  name = "Adam"

# Use the repo's layouts and static files as the theme.
[module]
  [[module.mounts]]
    source = "../layouts"
    target = "layouts"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "../static"
    target = "static"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
