{{ $paginator := .Paginator }}
{{ if or $paginator.HasPrev $paginator.HasNext }}
<div class="post-nav">
  {{ if $paginator.HasPrev }}
  <span class="prev"><a href="{{ $paginator.Prev.URL }}">← Newer Posts</a></span>
  {{ end }}
  {{ if $paginator.HasNext }}
  <span class="next"><a href="{{ $paginator.Next.URL }}">Older Posts →</a></span>
  {{ end }}
</div>
{{ end }}
