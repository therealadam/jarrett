{{/* Latest newsletter issues, fetched from Buttondown's RSS in the browser. */}}
<section class="newsletter-latest">
  <h3>Latest issues (client-side JS)</h3>
  <ul id="newsletter-latest-js"></ul>
</section>
<script>
  (async function () {
    var list = document.getElementById("newsletter-latest-js");
    try {
      var response = await fetch("https://buttondown.com/therealadam/rss");
      var xml = new DOMParser().parseFromString(await response.text(), "text/xml");
      var items = Array.from(xml.querySelectorAll("item")).slice(0, 3);
      items.forEach(function (item) {
        var link = document.createElement("a");
        link.href = item.querySelector("link").textContent;
        link.textContent = item.querySelector("title").textContent;

        var date = new Date(item.querySelector("pubDate").textContent);
        var time = document.createElement("time");
        time.dateTime = date.toISOString();
        time.textContent = date.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });

        var entry = document.createElement("li");
        entry.append(link, " ", time);
        list.append(entry);
      });
    } catch (error) {
      list.closest("section").hidden = true;
    }
  })();
</script>
