{{ define "main" }}
<div class="page">
  {{ if .Title }}
  <h2 class="p-name">{{ .Title }}</h2>
  {{ end }}
  <article class="post-content">
    {{ .Content }}
  </article>
  {{ if eq .RelPermalink "/newsletter/" }}
  {{ partial "newsletter-latest-hugo.html" . }}
  {{ partial "newsletter-latest-js.html" . }}
  {{ end }}
</div>
{{ end }}
